<body>
  <header class="app-header">
    <p class="app-eyebrow" id="today-label"></p>
    <h1 class="app-title">Todos</h1>
    <p class="app-summary" id="summary" aria-live="polite"></p>
    <button type="button" id="sync-status" class="sync-status" data-state="synced"
            aria-live="polite" title="Tap to sync now"></button>
    <button type="button" id="dev-toggle" class="dev-toggle" aria-expanded="false"
            aria-controls="dev-tools">More</button>
    <div id="dev-tools" class="dev-tools" hidden>
      <div class="more-row">
        <span class="more-label">Look</span>
        <span id="theme-swatches" class="theme-swatches" role="group" aria-label="Accent color"></span>
      </div>
      <div class="more-row">
        <span class="more-label">Mascot</span>
        <span class="more-items">
          <button type="button" id="sound-toggle" class="log-toggle" aria-pressed="false">Sound off</button>
          <button type="button" id="mascot-toggle" class="log-toggle" aria-pressed="true">Mascot on</button>
          <button type="button" id="shake-toggle" class="log-toggle" hidden>Shake to summon</button>
        </span>
      </div>
      <div class="more-row">
        <span class="more-label">Alerts</span>
        <span class="more-items">
          <button type="button" id="push-toggle" class="log-toggle" aria-pressed="false" hidden
                  title="Get one morning digest of what is due today or overdue">Reminders off</button>
          <button type="button" id="badge-enable" class="log-toggle" hidden
                  title="Show the number of todos due today on the app icon">icon badge</button>
        </span>
      </div>
      <div class="more-row" id="calendar-row" hidden>
        <span class="more-label">Calendar</span>
        <span class="more-items">
          <button type="button" id="calendar-subscribe" class="log-toggle"
                  title="Open in your Calendar app to subscribe to your due todos (read-only)">Subscribe</button>
          <button type="button" id="calendar-copy" class="log-toggle"
                  title="Copy the private feed link. Anyone with it can read your due todos">Copy link</button>
        </span>
      </div>
      <div class="more-row">
        <span class="more-label">Support</span>
        <span class="more-items">
          <button type="button" id="log-toggle" class="log-toggle" title="Show the event log">log</button>
        </span>
      </div>
    </div>
  </header>

  <div class="tabs-wrap">
    <div class="tabs" role="tablist" aria-label="Views">
      <div class="segmented">
        <button type="button" role="tab" id="tab-list" class="segmented-btn" data-tab="list"
                aria-selected="true" aria-controls="todo-tree">List</button>
        <button type="button" role="tab" id="tab-next" class="segmented-btn" data-tab="next"
                aria-selected="false" aria-controls="next-view">Next up</button>
      </div>
    </div>
  </div>

  <div id="ptr" class="ptr" aria-hidden="true">
    <svg class="ptr-arrow" viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
    <span class="ptr-spinner"></span>
  </div>

  <main class="app-main">
    <ul id="todo-tree" class="todo-tree" role="tabpanel" aria-labelledby="tab-list"></ul>
    <section id="next-view" class="next-view" role="tabpanel" aria-labelledby="tab-next" hidden>
      <p class="next-caption">What to work on next</p>
      <ol id="next-list" class="next-list"></ol>
      <p id="next-note" class="next-note" hidden></p>
    </section>
  </main>

  <div id="error" class="toast" role="alert" hidden></div>

  <div id="signin" class="signin" hidden>
    <h2>Todos</h2>
    <p id="signin-message" class="signin-message"></p>
    <button type="button" id="signin-button" class="signin-btn">Sign in with Google</button>
    <button type="button" id="signin-signout" class="signin-btn" hidden>Sign out</button>
  </div>

  <form id="add-form" class="composer">
    <div id="add-chips" class="chip-row composer-chips" hidden>
      <button type="button" class="chip" data-due="today">Today</button>
      <button type="button" class="chip" data-due="tomorrow">Tomorrow</button>
      <label class="chip chip-pick" id="add-pick"><span id="add-pick-text">Pick date</span>
        <input type="date" id="add-due" name="due" aria-label="Pick a due date">
      </label>
    </div>
    <div class="composer-inner">
      <input type="text" id="add-title" name="title" placeholder="New todo"
             autocomplete="off" enterkeyhint="done" aria-label="New todo" required>
      <button type="button" id="add-due-toggle" class="composer-date" aria-label="Set due date"
              aria-expanded="false" aria-controls="add-chips">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      </button>
      <button type="submit" class="composer-send" aria-label="Add todo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </form>

  <section id="event-log" class="event-log" aria-label="Event log" hidden>
    <div class="event-log-bar">
      <strong>Event log</strong>
      <span class="event-log-actions">
        <button type="button" id="event-log-copy">Copy</button>
        <button type="button" id="event-log-clear">Clear</button>
        <button type="button" id="event-log-close">Close</button>
      </span>
    </div>
    <pre id="event-log-text"></pre>
  </section>
